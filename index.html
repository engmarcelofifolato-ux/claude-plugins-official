    .lead-card{background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 2px 8px rgba(0,0,0,0.02); transition:all 0.3s ease; cursor:pointer;

    }
    .score-badge{display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:70px; gap:0.3rem;
    }
    .score-number{font-family:'Bebas Neue',sans-serif; font-size:1.8rem; font-weight:400; letter-spacing:0.04em; color:var(--text);
    }
    .score-tag{font-size:0.65rem; font-family:'Syne',sans-serif; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; padding:0.2rem 0.5rem; border-radius:3px; background:var(--quente-bg); color:var(--quente);
    }
    .score-tag.morno{background:var(--morno-bg); color:var(--morno);
    }
    .score-tag.frio{background:var(--frio-bg); color:var(--frio);
    }
    .lead-card-score-bar{height:6px; background:linear-gradient(90deg,var(--quente),var(--morno),var(--frio)); border-radius:3px; margin:1rem; overflow:hidden;
    }
    .lead-card-score-fill{height:100%; background:var(--oliva); border-radius:3px; transition:width 0.3s ease;
    }
    .lead-card-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; padding:0 1.5rem; margin-bottom:1rem; font-size:0.8rem;
    }
    .lead-card-grid-item{display:flex; flex-direction:column; gap:0.3rem;
    }
    .lead-card-grid-label{color:var(--muted2); font-size:0.7rem; font-family:'Syne',sans-serif; font-weight:600; letter-spacing:0.08em; text-transform:uppercase;
    }
    .lead-card-grid-value{color:var(--text); font-weight:500; white-space:nowrap; text-overflow:ellipsis; overflow:hidden;
    }
    .lead-card-events{padding:0 1.5rem 1rem; display:flex; flex-wrap:wrap; gap:0.5rem;
    }
    .event-tag{display:inline-flex; align-items:center; gap:0.3rem; padding:0.35rem 0.75rem; background:var(--oliva-bg); border:1px solid rgba(106,120,52,0.18); border-radius:5px; font-size:0.75rem; color:var(--oliva); font-family:'DM Sans',sans-serif;
    }
    .lead-card-servicos{padding:0 1.5rem 1rem; display:flex; flex-wrap:wrap; gap:1rem; font-size:0.8rem; color:var(--muted);
    }
    .servico-item{display:flex; align-items:center; gap:0.4rem;
    }
    .servico-item-check{color:var(--oliva); font-weight:700;
    }
    .lead-card-publico{padding:0.75rem 1.5rem; background:var(--oliva-bg); border-top:1px solid rgba(106,120,52,0.18); border-bottom:1px solid rgba(106,120,52,0.18); font-size:0.8rem; color:var(--oliva); display:flex; align-items:center; gap:0.5rem;
    }
    .lead-card-publico-icon{font-size:0.9rem;
    }
    .lead-card-footer{padding:1.5rem; display:flex; align-items:center; justify-content:space-between; gap:1rem; border-top:1px solid var(--border2);
    }
    .lead-card-data{display:flex; align-items:center; gap:0.4rem; font-size:0.8rem; color:var(--muted);
    }
    .lead-card-actions{display:flex; gap:0.8rem;
    }
    .lead-card-actions .btn{padding:0.5rem 1rem; font-size:0.7rem;
    }
    .modal-overlay{position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:1000; backdrop-filter:blur(2px); animation:fadeIn 0.2s ease;
    }
    @keyframes fadeIn{from{opacity:0; }
      to{opacity:1; }
    }
    @keyframes slideUp{from{transform:translateY(40px); opacity:0; }
      to{transform:translateY(0); opacity:1; }
    }
    .modal{background:var(--surface); border-radius:16px; max-width:600px; width:90%; max-height:80vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,0.2); animation:slideUp 0.3s ease;
    }
    .modal-header{padding:2rem; border-bottom:1px solid var(--border); display:flex; align-items:flex-start; justify-content:space-between; gap:1rem;

    .modal-footer{padding:2rem; border-top:1px solid var(--border); display:flex; gap:1rem; justify-content:flex-end;

            ]
          },{id:29,nome:"Processadora de Sucos Sabor Fruta",loc:"Catanduva,SP",municipio:"Catanduva",tipo:"Processamento",icon:"🥤",score:72,classe:"morno",oport:"media",oportTxt:"Fábrica em operação",consumo:"390 MWh/mês",atividade:"Processamento de frutas",proprietario:"Processadora Sabor Fruta Ltda.",cnpj:"12.234.567/0001-89",eventos:["Fábrica em turno 24h","Custo energético alto","Imóvel próprio"],servicos:["Solar para planta","Carregamento rápido","Monitoramento em tempo real"],publico:"Integradores solares · Fábricas",data:"21/05/2025",contato:"energia@saborfruta.com.br",tel:"(17) 3521-2000",scores:[{l:"Fábrica 24/7",p:22,m:30 },{l:"Custo alto",p:20,m:30 },{l:"Imóvel próprio",p:18,m:20 },{l:"Risco operacional",p:12,m:20 }
            ]
          },{id:30,nome:"Estação de Pesquisa ESALQ",loc:"Piracicaba,SP",municipio:"Piracicaba",tipo:"Pesquisa",icon:"🔬",score:64,classe:"morno",oport:"media",oportTxt:"Campus sustentável",consumo:"240 MWh/mês",atividade:"Pesquisa agrícola",proprietario:"Estação de Pesquisa ESALQ-USP",cnpj:"34.345.678/0001-90",eventos:["Projeto de sustentabilidade","Financiamento público","Demonstração para comunidade"],servicos:["Solar para pesquisa","Armazenamento com baterias","Monitoramento científico"],publico:"Universidades · Órgãos de pesquisa · Governo",data:"19/05/2025",contato:"pesquisa@esalq.usp.br",tel:"(19) 3417-6789",scores:[{l:"Projeto sustentável",p:20,m:30 },{l:"Financiamento público",p:19,m:30 },{l:"Demonstração comunitária",p:16,m:20 },{l:"Consumo moderado",p:9,m:20 }
            ]
          }
        ]
      }
    ];

    // ===== COMPONENTS =====

    function Topbar({currentModuleData,onLogoClick }){return (
        <div className="topbar">
          <div className="topbar-left">
            <div className="topbar-logo" onClick={onLogoClick} title="Voltar ao painel inicial">
              GeoRadar Agro
            </div>
            <div className="topbar-module">
              <span className="topbar-module-icon">{currentModuleData.icon}</span>
              <span className="topbar-module-name">{currentModuleData.nome}</span>
            </div>
            <div className="topbar-demo">
              <span>⚡</span>
              <span>Demonstração Completa</span>
            </div>
          </div>
          <div className="topbar-right">
            <div className="topbar-avatar">MAF</div>
          </div>
        </div>
      );
    }

    function Sidebar({modules,currentModuleId,onSelectModule }){return (
        <div className="sidebar">
          <div className="sidebar-section-title">Módulos Temáticos</div>
          <div className="sidebar-items">{modules.map(mod => (
              <div
                key={mod.id}
                className={`sidebar-item ${currentModuleId === mod.id ? 'active':''}`}
                onClick={() => onSelectModule(mod.id)}
              >
                <span className="sidebar-item-label">{mod.icon}{mod.nome}
                </span>
                <span className="sidebar-badge">{mod.leads.length}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function PageHeader({moduleData,filteredCount }){return (
        <div className="page-header">
          <div className="page-header-left">
            <h1 className="page-title">{moduleData.nome}</h1>
            <div className="page-subtitle">
              <span>{moduleData.desc}</span>
              <span>•</span>
              <span><strong>{filteredCount}</strong> lead{filteredCount !== 1 ? 's':''}</span>
            </div>
          </div>
          <div className="page-actions">
            <button className="btn btn-secondary">📥 Exportar CSV</button>
            <button className="btn btn-primary">🔔 Novo Alerta</button>
          </div>
        </div>
      );
    }

    function KPIRow({kpis }){return (
        <div className="kpi-row">
          <div className="kpi-card">
            <div className="kpi-label">Total de Leads</div>
            <div className="kpi-value">{kpis.total}</div>
          </div>
          <div className="kpi-card quente">
            <div className="kpi-label">🔥 Quentes</div>
            <div className="kpi-value">{kpis.quente}</div>
          </div>
          <div className="kpi-card morno">
            <div className="kpi-label">🌡️ Mornos</div>
            <div className="kpi-value">{kpis.morno}</div>
          </div>
          <div className="kpi-card frio">
            <div className="kpi-label">❄️ Frios</div>
            <div className="kpi-value">{kpis.frio}</div>
          </div>
        </div>
      );
    }

    function Filters({filtroAtivo,onSetFiltro,busca,onSetBusca }){return (
        <div className="filters">
          <span className="filters-label">Filtrar por Score:</span>
          <div className="filter-buttons">
            <button
              className={`filter-btn ${filtroAtivo === 'todos' ? 'active':''}`}
              onClick={() => onSetFiltro('todos')}
            >
              Todos
            </button>
            <button
              className={`filter-btn ${filtroAtivo === 'quente' ? 'active':''}`}
              onClick={() => onSetFiltro('quente')}
            >
              🔥 Quentes
            </button>
            <button
              className={`filter-btn ${filtroAtivo === 'morno' ? 'active':''}`}
              onClick={() => onSetFiltro('morno')}
            >
              🌡️ Mornos
            </button>
            <button
              className={`filter-btn ${filtroAtivo === 'frio' ? 'active':''}`}
              onClick={() => onSetFiltro('frio')}
            >
              ❄️ Frios
            </button>
            <div className="filter-divider"></div>
            <div className="filter-search">
              <span className="filter-search-icon">🔍</span>
              <input
                type="text"
                className="filter-search-input"
                placeholder="Buscar por nome ou município..."
                value={busca}
                onChange={(e) => onSetBusca(e.target.value)}
              />
            </div>
          </div>
        </div>
      );
    }

    function LeadCard({lead,onViewDetails }){const scoreClass = lead.score >= 80 ? 'quente':lead.score >= 60 ? 'morno':'frio'; const barWidth = (lead.score / 100) * 100; return (
        <div className="lead-card">
          <div className="lead-card-header">
            <div className="lead-card-info">
              <div className="lead-card-type">
                <span>{lead.icon}</span>
                <span>{lead.tipo}</span>
              </div>
              <div className="lead-card-name">{lead.nome}</div>
              <div className="lead-card-location">
                <span>📍</span>
                <span>{lead.loc}</span>
              </div>
              <div className={`lead-card-oportunidade ${lead.oport}`}>
                <span>💡</span>
                <span>{lead.oportTxt}</span>
              </div>
            </div>
            <div className="score-badge">
              <div className="score-number">{lead.score}</div>
              <div className={`score-tag ${scoreClass}`}>{scoreClass}</div>
            </div>
          </div>

          <div className="lead-card-score-bar">
            <div className="lead-card-score-fill" style={{width:`${barWidth}%` }}></div>
          </div>

          <div className="lead-card-grid">
            <div className="lead-card-grid-item">
              <div className="lead-card-grid-label">{lead.area ? 'Área':lead.capital ? 'Capital':'Consumo'}</div>
              <div className="lead-card-grid-value">{lead.area || lead.capital || lead.consumo}</div>
            </div>
            <div className="lead-card-grid-item">
              <div className="lead-card-grid-label">Atividade</div>
              <div className="lead-card-grid-value">{lead.atividade}</div>
            </div>
            <div className="lead-card-grid-item">
              <div className="lead-card-grid-label">Data</div>
              <div className="lead-card-grid-value">{lead.data}</div>
            </div>
          </div>{lead.eventos.length > 0 && (
            <div className="lead-card-events">{lead.eventos.map((e,idx) => (
                <span key={idx} className="event-tag">✦{e}</span>
              ))}
            </div>
          )}{lead.servicos.length > 0 && (
            <div className="lead-card-servicos">{lead.servicos.slice(0,2).map((s,idx) => (
                <div key={idx} className="servico-item">
                  <span className="servico-item-check">✓</span>
                  <span>{s}</span>
                </div>
              ))}{lead.servicos.length > 2 && (
                <div className="servico-item" style={{fontWeight:600,color:'var(--oliva)' }}>
                  +{lead.servicos.length - 2} serviços
                </div>
              )}
            </div>
          )}

          <div className="lead-card-publico">
            <span className="lead-card-publico-icon">🎯</span>
            <span>{lead.publico}</span>
          </div>

          <div className="lead-card-footer">
            <div className="lead-card-data">
              <span>📅</span>
              <span>{lead.data}</span>
            </div>
            <div className="lead-card-actions">
              <button className="btn btn-secondary" onClick={() => onViewDetails(lead)}>
                Ver Detalhes
              </button>
              <button className="btn btn-primary">
                📤 Exportar
              </button>
            </div>
          </div>
        </div>
      );
    }

    function Modal({lead,onClose }){if (!lead) return null; const scoreTotal = lead.scores.reduce((sum,s) => sum + s.p,0); const scoreMax = lead.scores.reduce((sum,s) => sum + s.m,0); return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <div className="modal-header-content">
                <h2 className="modal-title">{lead.nome}</h2>
                <div className="modal-location">
                  <span>📍</span>
                  <span>{lead.loc}</span>
                </div>
              </div>
              <button className="modal-close" onClick={onClose}>✕</button>
            </div>

            <div className="modal-body">
              <div className="modal-section">
                <h3 className="modal-section-title">Informações Principais</h3>
                <div className="modal-section-content">
                  <div className="modal-info-row">
                    <span className="modal-info-label">Empresa:</span>
                    <span className="modal-info-value">{lead.proprietario}</span>
                  </div>
                  <div className="modal-info-row">
                    <span className="modal-info-label">Município:</span>
                    <span className="modal-info-value">{lead.municipio}</span>
                  </div>
                  <div className="modal-info-row">
                    <span className="modal-info-label">Estado:</span>
                    <span className="modal-info-value">São Paulo (SP)</span>
                  </div>
                </div>
              </div>

              <div className="modal-section">
                <h3 className="modal-section-title">Dados Técnicos</h3>
                <div className="modal-section-content">
                  <div className="modal-info-row">
                    <span className="modal-info-label">CNPJ:</span>
                    <span className="modal-info-value">{lead.cnpj}</span>
                  </div>{lead.car && (
                    <div className="modal-info-row">
                      <span className="modal-info-label">CAR:</span>
                      <span className="modal-info-value">{lead.car}</span>
                    </div>
                  )}{lead.capital && (
                    <div className="modal-info-row">
                      <span className="modal-info-label">Capital:</span>
                      <span className="modal-info-value">{lead.capital}</span>
                    </div>
                  )}{lead.cnae && (
                    <div className="modal-info-row">
                      <span className="modal-info-label">CNAE:</span>
                      <span className="modal-info-value">{lead.cnae}</span>
                    </div>
                  )}{lead.consumo && (
                    <div className="modal-info-row">
                      <span className="modal-info-label">Consumo Mensal:</span>
                      <span className="modal-info-value">{lead.consumo}</span>
                    </div>
                  )}
                </div>
              </div>

              <div className="modal-section">
                <h3 className="modal-section-title">Público-Alvo</h3>
                <div className="modal-tags">{lead.publico.split(' · ').map((p,idx) => (
                    <span key={idx} className="modal-tag">🎯{p}</span>
                  ))}
                </div>
              </div>

              <div className="modal-section">
                <h3 className="modal-section-title">Serviços Oferecíveis</h3>
                <div className="modal-tags">{lead.servicos.map((s,idx) => (
                    <span key={idx} className="modal-tag">✓{s}</span>
                  ))}
                </div>
              </div>

              <div className="modal-section">
                <h3 className="modal-section-title">Sinais Detectados</h3>
                <div className="modal-tags">{lead.eventos.map((e,idx) => (
                    <span key={idx} className="modal-tag">✦{e}</span>
                  ))}
                </div>
              </div>

              <div className="modal-section">
                <h3 className="modal-section-title">Contato</h3>
                <div className="modal-section-content">
                  <div className="modal-info-row">
                    <span className="modal-info-label">Email:</span>
                    <span className="modal-info-value">{lead.contato}</span>
                  </div>
                  <div className="modal-info-row">
                    <span className="modal-info-label">Telefone:</span>
                    <span className="modal-info-value">{lead.tel}</span>
                  </div>
                </div>
              </div>

              <div className="modal-section">
                <h3 className="modal-section-title">Composição do Score</h3>
                <div className="modal-score-breakdown">{lead.scores.map((score,idx) => (
                    <div key={idx} className="score-item">
                      <div className="score-item-label">{score.l}</div>
                      <div className="score-item-bar-container">
                        <div
                          className="score-item-bar"
                          style={{width:`${(score.p / score.m) * 100}%` }}
                        ></div>
                      </div>
                      <div className="score-item-value">{score.p}/{score.m}</div>
                    </div>
                  ))}
                  <div style={{borderTop:'1px solid var(--border)',marginTop:'0.75rem',paddingTop:'0.75rem',display:'flex',justifyContent:'space-between',fontWeight:600,color:'var(--text)' }}>
                    <span>Total do Score</span>
                    <span>{scoreTotal}/{scoreMax}</span>
                  </div>
                </div>
              </div>
            </div>

            <div className="modal-footer">
              <button className="btn btn-secondary" onClick={onClose}>Fechar</button>
              <button className="btn btn-primary">📤 Exportar Lead</button>
            </div>
          </div>
        </div>
      );
    }

    function App(){const [currentModuleId,setCurrentModuleId] = useState('fundiario'); const [filtroAtivo,setFiltroAtivo] = useState('todos'); const [busca,setBusca] = useState(''); const [modalOpen,setModalOpen] = useState(false); const [selectedLead,setSelectedLead] = useState(null); const currentModule = MODULES_DATA.find(m => m.id === currentModuleId); const filtered = useMemo(() =>{return currentModule.leads.filter(l =>{let matchFiltro = true; if (filtroAtivo === 'quente') matchFiltro = l.score >= 80; else if (filtroAtivo === 'morno') matchFiltro = l.score >= 60 && l.score < 80; else if (filtroAtivo === 'frio') matchFiltro = l.score < 60; const matchBusca = !busca ||
            l.nome.toLowerCase().includes(busca.toLowerCase()) ||
            l.municipio.toLowerCase().includes(busca.toLowerCase()); return matchFiltro && matchBusca;
        });
      },[currentModule,filtroAtivo,busca]); const kpis = useMemo(() => ({total:currentModule.leads.length,quente:currentModule.leads.filter(l => l.score >= 80).length,morno:currentModule.leads.filter(l => l.score >= 60 && l.score < 80).length,frio:currentModule.leads.filter(l => l.score < 60).length,}),[currentModule]); const handleSelectModule = (moduleId) =>{setCurrentModuleId(moduleId); setFiltroAtivo('todos'); setBusca('');
      }; const handleViewDetails = (lead) =>{setSelectedLead(lead); setModalOpen(true);
      }; const handleCloseModal = () =>{setModalOpen(false); setSelectedLead(null);
      }; return (
        <>
          <Topbar
            currentModuleData={currentModule}
            onLogoClick={() => handleSelectModule('fundiario')}
          />
          <div className="app-wrapper">
            <Sidebar
              modules={MODULES_DATA}
              currentModuleId={currentModuleId}
              onSelectModule={handleSelectModule}
            />
            <div className="main">
              <PageHeader
                moduleData={currentModule}
                filteredCount={filtered.length}
              />
              <KPIRow kpis={kpis} />
              <Filters
                filtroAtivo={filtroAtivo}
                onSetFiltro={setFiltroAtivo}
                busca={busca}
                onSetBusca={setBusca}
              />
              <div className="leads-grid">{filtered.length > 0 ? (
                  filtered.map(lead => (
                    <LeadCard
                      key={lead.id}
                      lead={lead}
                      onViewDetails={handleViewDetails}
                    />
                  ))
                ):(
                  <div className="leads-empty">
                    <div className="leads-empty-icon">🔍</div>
                    <div className="leads-empty-text">Nenhum lead encontrado</div>
                  </div>
                )}
              </div>
            </div>
          </div>{modalOpen && <Modal lead={selectedLead} onClose={handleCloseModal} />}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
